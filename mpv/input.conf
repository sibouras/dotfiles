l osd-msg-bar seek +5
h osd-msg-bar seek -5
k sub-seek +1
j sub-seek -1
L no-osd seek +1 exact
H no-osd seek -1 exact
K no-osd seek +5 exact
J no-osd seek -5 exact

p show-text ${playlist}                # show the playlist
; ab-loop                              # set/clear A-B loop points
: cycle-values loop-file "inf" "no"    # toggle infinite looping
n cycle sub                            # switch subtitle track
N cycle sub down                       # switch subtitle track backwards
Y cycle-values vf "negate" ""          # reverse colors
a cycle-values video-rotate 90 180 270 0 ; show-text "Video Rotion: ${video-rotate}"
o script-message osc-visibility cycle
0 ignore
- add volume -2
= add volume +2
r cycle pause                          # toggle pause/playback mode
t ignore
x add sub-pos -1                       # move subtitles up
X add sub-pos +1                       # move subtitles down
