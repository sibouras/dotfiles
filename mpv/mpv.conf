ytdl-format="bv+ba[format_id*=drc]+ba/bv+ba/b" # if the file has multiple audio tracks the last track is the default
ytdl-raw-options=format-sort="res:1080,hdr:SDR,proto,vcodec:vp9.2",audio-multistreams=
sub-visibility=yes
sub-auto=fuzzy
audio-file-auto=fuzzy
screenshot-directory="~/Pictures/mpv"
screenshot-template=mpv-shot-%tY%tm%td_%tH%tM%tS
directory-filter-types=video,audio
autocreate-playlist=filter
save-watch-history
save-position-on-quit=yes
script-opts=stats-font_size=23
